services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingres-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_PATH=/app/data/ingres.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ingres-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: ingres-network
